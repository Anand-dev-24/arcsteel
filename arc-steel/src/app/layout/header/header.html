<mat-toolbar class="header">

    <div class="container header-container">

        <a routerLink="/" class="logo">

            <img [src]="config.site()?.logo" [alt]="config.site()?.companyName">

        </a>

        <nav class="desktop-menu">

            @for(menu of config.navigation(); track menu.id){

            <a mat-button [routerLink]="menu.route" routerLinkActive="active"
                [routerLinkActiveOptions]="{exact: menu.route === '/'}">

                {{ menu.title }}

            </a>

            }

        </nav>

        <button mat-icon-button class="mobile-menu">

            <mat-icon>menu</mat-icon>

        </button>

    </div>

</mat-toolbar>
